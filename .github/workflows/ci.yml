name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  build:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Dependencies are baked into the image; see .github/ci-image/Dockerfile.
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check JavaScript syntax
        run: |
          status=0
          for f in src/*.js; do
            echo "Checking $f"
            node --input-type=module --check < "$f" || status=1
          done
          exit $status

      - name: Validate GSettings schema
        run: glib-compile-schemas --strict --dry-run src/schemas

      - name: Compile translations
        run: |
          for po in po/*.po; do
            msgfmt --check --output-file=/dev/null "$po"
            echo "OK: $po"
          done

      - name: Pack extension
        run: ./install.sh zip

      - name: Upload extension zip
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gnockoff-tiles@episode6.com.shell-extension
          path: gnockoff-tiles@episode6.com.shell-extension.zip
